<!DOCTYPE html>
<html>
<head>
    <style>
        .container {
            display: flex;
            gap: 16px;
        }

        .card {
            background: #f5f5f5;
            border: 1px solid #ccc;
            border-radius: 12px;
            padding: 16px;
        }
        body {
            font-family: sans-serif;
            background: #fafafa;
            padding: 20px;
        }

        h1 {
            color: #2c5f2d;
            font-size: 32px;
        }

        .card h2 {
            color: #555;
            font-size: 20px;
            margin-top: 0;
        }

        .card li {
            color: #1a5490;
        }
    </style>
</head>
<body>
  <h1>한일고 40기</h1>

  <div class="container">
    <div class="card">
      <h2>오늘 급식</h2>
      <ul>
        <li>백미밥</li>
        <li>미역국</li>
      </ul>
    </div>

    <div class="card">
      <h2>내일 급식</h2>
      <ul>
        <li>비빔밥</li>
        <li>된장국</li>
      </ul>
    </div>

    <div class="card">
      <h2>오늘 시간표</h2>
      <ol>
        <li>국어</li>
        <li>수학</li>
        <li>영어</li>
      </ol>
    </div>
  </div>
</body>
</html>
